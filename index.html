<div id="lockscreen" style="position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:Vazirmatn,Tahoma,sans-serif">

</div>

</div>
<script>
(function(){
  const PW_HASH="c804c718a4ef8cc39fda5f906e0d362d4320c492bde321875ec9588d20f9bd43";
  const LS_KEY="dash_unlocked_v1";
  async function sha256(msg){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  function unlock(){
    document.getElementById('lockscreen').style.display='none';
    document.getElementById('app-content').style.display='';
  }
  try{if(localStorage.getItem(LS_KEY)==PW_HASH){unlock()}}catch(e){}
  document.getElementById('lock-form').addEventListener('submit',async function(e){
    e.preventDefault();
    const val=document.getElementById('lock-pw').value;
    const h=await sha256(val);
    if(h===PW_HASH){
      try{localStorage.setItem(LS_KEY,PW_HASH)}catch(e){}
      unlock();
    }else{
      document.getElementById('lock-err').textContent='رمز اشتباه است.';
      document.getElementById('lock-pw').value='';
    }
  });
})();
</script>
