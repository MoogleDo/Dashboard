<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>داشبورد عملیات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffa31f">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="داشبورد">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#edf1f4;--bg2:#e3e9ee;--cd:#fff;--tx:#16222c;--mu:#5c6b78;--bd:#d7dfe6;--pr:#ffa31f;--pr-wash:#fdecd2;--crit:#c23b3b;--crit-wash:#fbe7e7;--warn:#a9711a;--warn-wash:#f6ecd8;--good:#649655;--good-wash:#e7efe2;--new:#6e4fc6;--new-wash:#ece6f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--bg2:#1b2530;--cd:#18222d;--tx:#e7edf2;--mu:#9fb0bd;--bd:#2b3947;--pr:#ffb347;--pr-wash:#3d2a10;--crit:#e57373;--crit-wash:#38201f;--warn:#d9a53f;--warn-wash:#3a2f17;--good:#8bbf78;--good-wash:#223a1c;--new:#a98cf0;--new-wash:#2a2140}}
:root[data-theme="dark"]{--bg:#0f1620;--bg2:#1b2530;--cd:#18222d;--tx:#e7edf2;--mu:#9fb0bd;--bd:#2b3947;--pr:#ffb347;--pr-wash:#3d2a10;--crit:#e57373;--crit-wash:#38201f;--warn:#d9a53f;--warn-wash:#3a2f17;--good:#8bbf78;--good-wash:#223a1c;--new:#a98cf0;--new-wash:#2a2140}
html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px Vazirmatn,Tahoma,sans-serif}
header{padding:14px 18px 0}h1{margin:0;font-size:20px}h1 small{color:var(--mu);font-size:12px;font-weight:400}
select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 6px}
button{cursor:pointer}button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.shell{display:flex;min-height:100vh}.content{flex:1;min-width:0}
.rail{width:84px;flex:none;background:var(--cd);border-inline-start:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:3px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.rail .mark{width:36px;height:36px;border-radius:10px;background:var(--cd);display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bd)}
.rail .mark img{width:100%;height:100%;object-fit:contain;display:block}
.rail .mark svg{width:20px;height:20px}
#tb{display:contents}
.rail button{all:unset;display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;padding:9px 0;border-radius:11px;cursor:pointer;color:var(--mu);font:inherit}
.rail button svg{width:19px;height:19px}
.rail button span{font-size:10.5px;font-weight:500;white-space:normal;text-align:center;line-height:1.25}
.rail button.on{background:var(--pr-wash);color:var(--pr)}
.rail button:hover:not(.on){background:var(--bg2)}
.rail .sp{flex:1}
@media (max-width:760px){.shell{flex-direction:column}.rail{width:100%;height:auto;position:fixed;bottom:0;top:auto;flex-direction:row;justify-content:space-around;padding:6px 2px;border-inline-start:none;border-top:1px solid var(--bd);z-index:40;align-self:stretch}.rail .mark,.rail .sp{display:none}.rail button{width:auto;padding:6px 8px}.content{padding-bottom:62px}}
main{padding:14px 18px 30px}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kc,.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.kc b{display:block;font-size:22px;margin:2px 0}.kc span,.kc i{font-size:12px;color:var(--mu);font-style:normal}.dl{font-size:12px;font-weight:700;margin-right:6px;vertical-align:middle}.dlu{color:#16a34a}.dld{color:#ef4444}.rh-up,.rh-down{border-radius:10px;padding:10px}.rh-up{background:rgba(16,185,129,.14)}.rh-down{background:rgba(239,68,68,.14)}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-bottom:12px}.c h3{margin:0 0 8px;font-size:14px}.c.w{grid-column:1/-1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mu)}
.bg{padding:1px 8px;border-radius:10px;color:#fff;font-size:11px}.hi{background:var(--crit)}.md{background:var(--warn)}.lo{background:var(--good)}.gy{background:#8796a3}.nw{background:var(--new)}
tr.nw-row td{background:rgba(110,79,198,.14)}.kc.nw-row{background:rgba(110,79,198,.14);border-color:rgba(110,79,198,.5)}
tr.act-hi td{background:var(--crit-wash)}tr.act-md td{background:var(--warn-wash)}tr.act-done td{background:var(--good-wash)}tr.act-plan td{background:var(--bg2)}
.g{padding-top:22px;position:relative}.gr{display:flex;align-items:center;margin:5px 0}.gl{width:170px;flex:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt{position:relative;flex:1;height:30px;background:var(--bg2);border-radius:6px;background-image:linear-gradient(to left,var(--bd) 1px,transparent 1px);background-size:25% 100%}.gt .b{position:absolute;top:7px;height:16px;border-radius:4px;cursor:pointer}.gt .m{position:absolute;top:8px;width:13px;height:13px;transform:rotate(45deg);margin-right:-6px;border:2px solid var(--cd);box-sizing:border-box;cursor:pointer}.gt .m::after{content:'';position:absolute;inset:-9px}
.gt .rf,.ax .rf{position:absolute;top:0;bottom:0;width:2px;background:#ef4444}.ax{position:absolute;top:0;right:170px;left:0;height:18px;font-size:11px;color:var(--mu)}.ax span{position:absolute;transform:translateX(50%);white-space:nowrap}
.lk{cursor:pointer;color:var(--pr);text-decoration:underline dotted;text-underline-offset:3px}.lk:hover{text-decoration:underline}
#gm{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}#gm[hidden]{display:none}
.gmb{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:960px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35)}.gmh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);font-size:15px}.gmc{overflow:auto;flex:1;min-height:0;padding:14px 16px;-webkit-overflow-scrolling:touch}
.gi{margin-top:8px;padding:8px 10px;background:var(--bg2);border-radius:8px;font-size:12px;min-height:18px;color:var(--mu)}
@media (max-width:640px){.gr{flex-direction:column;align-items:stretch;margin:12px 0}.gl{width:auto;white-space:normal;font-weight:600;margin-bottom:4px;font-size:13px}.ax{right:0}.ax span:nth-of-type(even){display:none}.gt{height:34px}.gt .b{top:8px;height:18px}.gt .m{top:10px;width:14px;height:14px}main{padding-inline:10px}}
.st{display:inline-block;width:11px;height:11px;border-radius:2px;margin-left:2px}.pb{background:var(--bg2);border-radius:4px;width:110px;height:10px;display:inline-block}.pb i{display:block;height:100%;background:var(--pr);border-radius:4px}.pg i{background:repeating-linear-gradient(to left,transparent 0 9%,var(--cd) 9% 10%) right/110px 100% no-repeat,linear-gradient(to left,#991b1b 0% 10%,#b91c1c 10% 20%,#c62828 20% 30%,#dc2626 30% 40%,#ef4444 40% 50%,#65a30d 50% 60%,#4d9f2f 60% 70%,#22a34f 70% 80%,#16a34a 80% 90%,#15803d 90% 100%) right/110px 100% no-repeat}
.sh{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:14px}.cb-hi{border-inline-start:4px solid #ef4444}.cb-md{border-inline-start:4px solid #f59e0b}.cb-warn{border-inline-start:4px solid #eab308}.cb-ok{border-inline-start:4px solid #10b981}.hb{background:var(--bg2);border-radius:8px;height:26px;overflow:hidden;position:relative}.hb i{display:block;height:100%;border-radius:8px;transition:width .6s}.hb span{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}.sh b{border-inline-start:4px solid var(--pr);padding-inline-start:8px}.sh span{color:var(--mu);font-size:11px}
.nt{color:var(--mu);font-size:12px;margin:0 0 10px}
.att-head{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px;flex-wrap:wrap}.att-head .att-n{font-size:34px;font-weight:800;line-height:1;color:var(--crit)}.att-head .att-n.zero{color:var(--good)}.att-head span{font-size:13px;color:var(--mu)}
.fcard{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.fdot{width:9px;height:9px;border-radius:50%;flex:none}
.fcard.sev-hi .fdot{background:var(--crit)}.fcard.sev-md .fdot{background:var(--warn)}
.fhead b{flex:1;font-size:13.5px;font-weight:600}
.fcount{background:var(--bg2);color:var(--tx);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.fchev{color:var(--mu);transition:transform .2s;font-size:14px}
.fcard.open .fchev{transform:rotate(90deg)}
.fbody{display:none;border-top:1px solid var(--bd)}
.fcard.open .fbody{display:block}
.frow{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:12.5px}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--bg2)}
.frow .fnm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fsub{color:var(--mu);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .ftag{color:var(--mu);font-size:11.5px;flex:none;white-space:nowrap}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 50% 40%,#1b2420 0%,#12181f 62%,#0b0f14 100%);transition:opacity .55s ease,visibility .55s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .rig{display:flex;flex-direction:column;align-items:center;gap:22px}
#splash .logo-wrap{width:96px;height:96px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.72);animation:logo-in .7s cubic-bezier(.22,1,.36,1) forwards .1s}
#splash .logo-wrap img{width:88px;height:88px;object-fit:contain}
#splash .wordmark{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(10px);animation:word-in .6s cubic-bezier(.22,1,.36,1) forwards .75s}
#splash .wordmark b{font-size:24px;font-weight:800;letter-spacing:.5px;color:#f3f6f4;font-family:Vazirmatn,Tahoma,sans-serif}
#splash .wordmark span{font-size:12px;color:#aebcb4;font-family:Vazirmatn,Tahoma,sans-serif}
@keyframes logo-in{0%{opacity:0;transform:scale(.72);filter:drop-shadow(0 0 0 rgba(255,163,31,0))}60%{opacity:1;transform:scale(1.06);filter:drop-shadow(0 0 22px rgba(255,163,31,.45))}100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,163,31,.22))}}
@keyframes word-in{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#splash .logo-wrap,#splash .wordmark{animation:none;opacity:1;transform:none;filter:none}}
</style></head><body>
<div id="lockscreen" style="position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:Vazirmatn,Tahoma,sans-serif">
<div style="font-size:16px;color:var(--tx);font-weight:800">داشبورد عملیات</div>

<button type="submit" style="padding:8px 28px;border-radius:8px;border:none;background:var(--pr);color:#fff;cursor:pointer;font-family:inherit;font-size:13px">ورود</button>

<script>
(function(){
  const PW_HASH="c804c718a4ef8cc39fda5f906e0d362d4320c492bde321875ec9588d20f9bd43";
  const LS_KEY="dash_unlocked_v1";
  async function sha256(msg){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  function bootSplash(){
    const el=document.getElementById('splash');
    if(!el)return;
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let already=false;
    try{already=sessionStorage.getItem('niak_booted')==='1'}catch(e){}
    if(reduce||already){el.classList.add('hide');setTimeout(()=>el.remove(),600);return}
    setTimeout(()=>{el.classList.add('hide');setTimeout(()=>el.remove(),600)},1900);
    try{sessionStorage.setItem('niak_booted','1')}catch(e){}
  }
  function unlock(){
    document.getElementById('lockscreen').style.display='none';
    document.getElementById('app-content').style.display='';
    bootSplash();
  }
  try{if(localStorage.getItem(LS_KEY)==PW_HASH){unlock()}}catch(e){}
  document.getElementById('lock-form').addEventListener('submit',async function(e){
    e.preventDefault();
    const val=document.getElementById('lock-pw').value;
    const h=await sha256(val);
    if(h===PW_HASH){
      try{localStorage.setItem(LS_KEY,PW_HASH)}catch(e){}
      unlock();
    }else{
      document.getElementById('lock-err').textContent='رمز اشتباه است.';
      document.getElementById('lock-pw').value='';
    }
  });
})();
</script>
